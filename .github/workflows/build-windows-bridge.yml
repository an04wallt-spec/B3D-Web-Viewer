name: Build Windows B3D Publisher bridge

on:
  push:
    paths:
      - 'host/B3DPublisherHost/**'
      - 'tests/test_publisher.py'
      - '.github/workflows/build-windows-bridge.yml'
      - 'PUBLISHER_VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify production route
        shell: pwsh
        run: |
          $program = Get-Content host/B3DPublisherHost/Program.cs -Raw
          $bridge = Get-Content host/B3DPublisherHost/Bazis24FinalMeshPublisher.js -Raw
          $project = Get-Content host/B3DPublisherHost/B3DPublisherHost.csproj -Raw
          if ($project -notmatch 'EmbeddedResource Include="Bazis24FinalMeshPublisher\.js"') { throw 'Official BAZIS mesh bridge is not embedded' }
          foreach ($token in @('IsMesh\(\)','AsMesh\(\)','TriLists','surface\.Triangles','Vertex1','Vertex2','Vertex3','ToGlobal','NToGlobal','TexCoord1','PathAbsolute')) {
            if ($bridge -notmatch $token) { throw "Missing official final-mesh API token: $token" }
          }
          if ($bridge -match 'ExportModelMeshFormat\(') { throw 'OBJ/mesh export route is forbidden' }
          if ($program -match 'UploadModelFromStream|TryInvokeNativeWebViewer|B3D-Native-Capture_|Cfrn') { throw 'Research/WebViewer route leaked into production Program.cs' }
          $initializers = Get-ChildItem host/B3DPublisherHost/*.cs | Select-String -Pattern '\[ModuleInitializer\]|ProcessExit \+=' -SimpleMatch:$false
          if ($initializers) { throw "Automatic research initializers remain in production host: $($initializers.Path -join ', ')" }
          if ($bridge -notmatch 'Снять выделение' -or $bridge -notmatch "e\.key==='Escape'") { throw 'Clear-selection UX is missing' }
          if ($bridge -match '<script\s+src=' -or $bridge -match 'https?://') { throw 'External dependency detected in bridge HTML template' }
      - name: Check bridge JavaScript syntax
        shell: pwsh
        run: node --check host/B3DPublisherHost/Bazis24FinalMeshPublisher.js
      - name: Publish single-file EXE
        run: >-
          dotnet publish host/B3DPublisherHost/B3DPublisherHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/B3D-Publisher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  B3D-Publisher.exe" | Set-Content -Encoding ascii out/SHA256.txt
          Write-Host "B3D-Publisher.exe SHA256=$hash"
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: |
            out/B3D-Publisher.exe
            out/SHA256.txt
          if-no-files-found: error

  release:
    if: contains(github.event.head_commit.message, '[publisher-release]')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: release
      - name: Read version
        shell: pwsh
        run: |
          $version = '${{ github.event.head_commit.message }}' -replace '^.*\[publisher-release\]\s*',''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Release version is missing from commit message' }
          "PUBLISHER_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "publisher-$env:PUBLISHER_RELEASE_VERSION"
          release/B3D-Publisher.exe
          release/SHA256.txt
          --target "$env:GITHUB_SHA"
          --title "B3D Publisher $env:PUBLISHER_RELEASE_VERSION"
          --notes "Windows x64 self-contained publisher. Production geometry is read only from the official BAZIS TTriMesh/TTriangleList/T3DTriangle Script API and written to one fully offline self-contained HTML. Materials and browser-supported texture files are embedded where BAZIS exposes them. No B3D reconstruction, OBJ/3DS/DAE conversion, WebViewer cloud dependency, or license bypass."

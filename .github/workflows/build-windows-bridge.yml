name: Build Windows B3D Publisher bridge

on:
  push:
    paths:
      - 'host/B3DPublisherHost/**'
      - 'tests/test_publisher.py'
      - '.github/workflows/build-windows-bridge.yml'
      - 'PUBLISHER_VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify production route
        shell: pwsh
        run: |
          $program = Get-Content host/B3DPublisherHost/Program.cs -Raw
          $exporter = Get-Content host/B3DPublisherHost/Viewer3DExporter.cs -Raw
          $parser = Get-Content host/B3DPublisherHost/VrmlParser.cs -Raw
          $html = Get-Content host/B3DPublisherHost/OfflineHtmlPublisher.cs -Raw
          $probe = Get-Content host/B3DPublisherHost/B3DHandlerProbe.cs -Raw
          $project = Get-Content host/B3DPublisherHost/B3DPublisherHost.csproj -Raw
          $production = $program + $exporter + $parser + $html + $probe + $project

          foreach ($token in @('Viewer3DExporter.ExportToTemporaryWrl','VrmlParser.Parse','OfflineHtmlPublisher.Publish','local-view-bazis-viewer3d-wrl-1')) {
            if ($program -notmatch [regex]::Escape($token)) { throw "Missing final-geometry bridge token: $token" }
          }
          foreach ($token in @('Viewer24.exe','Viewer3D','\.wrl','VRML','1136','1001')) {
            if ($exporter -notmatch $token) { throw "Missing official Viewer3D export token: $token" }
          }
          foreach ($token in @('IndexedFaceSet','coordIndex','TextureCoordinate','texCoordIndex','ImageTexture','diffuseColor')) {
            if ($parser -notmatch $token) { throw "Missing VRML parser token: $token" }
          }
          foreach ($token in @('data:',';base64,','gl\.drawElements','gl\.LINES','gl\.readPixels','Снять выделение','Escape','Прозрачность','Рёбра')) {
            if ($html -notmatch $token) { throw "Missing offline viewer token: $token" }
          }
          foreach ($token in @('--probe-b3d-handler','B3DHandlerProbe.BuildReport')) {
            if ($program -notmatch [regex]::Escape($token)) { throw "Missing shell handler probe entry point: $token" }
          }
          foreach ($token in @('E357FCCD-A995-4576-B01F-234630154E96','8895B1C6-B41F-4C1C-A562-0D564250836F','InprocServer32','LocalServer32','RegistryView.Registry64','RegistryView.Registry32')) {
            if ($probe -notmatch [regex]::Escape($token)) { throw "Missing shell handler diagnostic token: $token" }
          }

          # Production must consume geometry emitted by BAZIS/Viewer3D. Research
          # parsers may remain in the repository but must never enter this assembly.
          foreach ($forbidden in @('parse_current_model','extract_final_meshes','decode_contour_blob','Manifold','solid=solid-','app/direct_publisher.py','geometry/final_geometry.py')) {
            if ($production -match [regex]::Escape($forbidden)) { throw "B3D reconstruction leaked into production host: $forbidden" }
          }
          foreach ($forbidden in @('UploadModelFromStream','TryInvokePublisherScript','currentFileData','TryInvokeNativeWebViewer','B3D-Native-Capture_','Cfrn','ExportModelMeshFormat','\.obj','\.3ds','\.dae')) {
            if ($production -match $forbidden) { throw "Forbidden production route found: $forbidden" }
          }
          if ($html -notmatch 'html\.Contains\("http://"' -or $html -notmatch 'html\.Contains\("https://"' -or $html -notmatch 'html\.Contains\("<script src="') {
            throw 'Runtime offline validation is missing from HTML publisher'
          }

      - name: Build single-file EXE
        run: >-
          dotnet publish host/B3DPublisherHost/B3DPublisherHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path out/B3D-Publisher.exe)) { throw 'B3D-Publisher.exe was not built' }
          $hash = (Get-FileHash out/B3D-Publisher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  B3D-Publisher.exe" | Set-Content -Encoding ascii out/SHA256.txt
          Write-Host "B3D-Publisher.exe SHA256=$hash"

      - name: Upload research build
        uses: actions/upload-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: |
            out/B3D-Publisher.exe
            out/SHA256.txt
          if-no-files-found: error

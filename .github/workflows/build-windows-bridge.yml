name: Build Windows B3D Publisher bridge

on:
  push:
    paths:
      - 'host/B3DPublisherHost/**'
      - '.github/workflows/build-windows-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file EXE
        run: >-
          dotnet publish host/B3DPublisherHost/B3DPublisherHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: out/B3D-Publisher.exe
          if-no-files-found: error

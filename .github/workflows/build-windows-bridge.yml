name: Build Windows B3D Publisher bridge

on:
  push:
    paths:
      - 'host/B3DPublisherHost/**'
      - 'tests/test_publisher.py'
      - '.github/workflows/build-windows-bridge.yml'
      - 'PUBLISHER_VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify production route
        shell: pwsh
        run: |
          $program = Get-Content host/B3DPublisherHost/Program.cs -Raw
          $exporter = Get-Content host/B3DPublisherHost/Viewer3DExporter.cs -Raw
          $parser = Get-Content host/B3DPublisherHost/VrmlParser.cs -Raw
          $html = Get-Content host/B3DPublisherHost/OfflineHtmlPublisher.cs -Raw
          $project = Get-Content host/B3DPublisherHost/B3DPublisherHost.csproj -Raw

          foreach ($token in @('Viewer3DExporter.ExportToTemporaryWrl','VrmlParser.Parse','OfflineHtmlPublisher.Publish','local-view-bazis-viewer3d-wrl-1')) {
            if ($program -notmatch [regex]::Escape($token)) { throw "Missing Viewer3D production token: $token" }
          }
          foreach ($token in @('Viewer24.exe','Viewer3D','\.wrl','VRML','1136','1001')) {
            if ($exporter -notmatch $token) { throw "Missing official Viewer3D export token: $token" }
          }
          foreach ($token in @('IndexedFaceSet','coordIndex','TextureCoordinate','texCoordIndex','ImageTexture','diffuseColor')) {
            if ($parser -notmatch $token) { throw "Missing VRML parser token: $token" }
          }
          foreach ($token in @('data:',';base64,','gl\.drawElements','gl\.LINES','gl\.readPixels','Снять выделение','Escape','Прозрачность','Рёбра')) {
            if ($html -notmatch $token) { throw "Missing offline viewer token: $token" }
          }

          $production = $program + $exporter + $parser + $html + $project
          foreach ($forbidden in @('InstallOfficialMeshBridge','TryInvokePublisherScript','currentFileData','UploadModelFromStream','TryInvokeNativeWebViewer','B3D-Native-Capture_','Cfrn','ExportModelMeshFormat','\.obj','\.3ds','\.dae')) {
            if ($production -match $forbidden) { throw "Forbidden production route found: $forbidden" }
          }
          if ($project -match 'Bazis24FinalMeshPublisher\.js') { throw 'Script bridge remains embedded in production assembly' }
          if ($html -match '<script\s+src=' -or $html -match 'https?://') { throw 'External dependency detected in HTML publisher' }
          $initializers = Get-ChildItem host/B3DPublisherHost/*.cs | Select-String -Pattern '\[ModuleInitializer\]|ProcessExit \+=' -SimpleMatch:$false
          if ($initializers) { throw "Automatic research initializers remain in production host: $($initializers.Path -join ', ')" }

      - name: Publish single-file EXE
        run: >-
          dotnet publish host/B3DPublisherHost/B3DPublisherHost.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/B3D-Publisher.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  B3D-Publisher.exe" | Set-Content -Encoding ascii out/SHA256.txt
          Write-Host "B3D-Publisher.exe SHA256=$hash"
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: |
            out/B3D-Publisher.exe
            out/SHA256.txt
          if-no-files-found: error

  release:
    if: contains(github.event.head_commit.message, '[publisher-release]')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: B3D-Publisher-Windows
          path: release
      - name: Read version
        shell: pwsh
        run: |
          $version = '${{ github.event.head_commit.message }}' -replace '^.*\[publisher-release\]\s*',''
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Release version is missing from commit message' }
          "PUBLISHER_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "publisher-$env:PUBLISHER_RELEASE_VERSION"
          release/B3D-Publisher.exe
          release/SHA256.txt
          --repo "${{ github.repository }}"
          --target "$env:GITHUB_SHA"
          --title "B3D Publisher $env:PUBLISHER_RELEASE_VERSION"
          --notes "Windows x64 self-contained publisher. Production route is scriptless: the official BAZIS Viewer3D utility opens B3D and saves a temporary VRML mesh, which Publisher packages into one fully offline HTML and then removes the temporary export. Materials and local texture images are embedded where Viewer3D exposes them. No B3D reconstruction, OBJ/3DS/DAE production route, WebViewer cloud dependency, scripts, or license bypass."

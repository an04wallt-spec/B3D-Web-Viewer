name: Build Generic Groups Test

on:
  workflow_dispatch:
  push:
    paths:
      - "test-generic-groups/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir build
          cat test-generic-groups/source.b64.part-* | base64 -d > /tmp/generic-groups-source.zip
          unzip -q /tmp/generic-groups-source.zip -d build
          cd build
          gofmt -w builder.go
          GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui" -o "Генератор_PRO_GENERIC_GROUPS_TEST_2026-09-30.exe" .
          sha256sum "Генератор_PRO_GENERIC_GROUPS_TEST_2026-09-30.exe" > SHA256.txt
          zip -9 "../GENERIC_GROUPS_TEST_PACKAGE_2026-09-30.zip" "Генератор_PRO_GENERIC_GROUPS_TEST_2026-09-30.exe" builder.go main_windows.go builder_test_main.go go.mod SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GENERIC_GROUPS_TEST_PACKAGE_2026-09-30
          path: GENERIC_GROUPS_TEST_PACKAGE_2026-09-30.zip
          if-no-files-found: error
          retention-days: 30

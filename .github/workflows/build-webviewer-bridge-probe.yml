name: Build BAZIS WebViewer bridge probe

on:
  push:
    paths:
      - 'host/BazisWebViewerBridgeProbe/**'
      - '.github/workflows/build-webviewer-bridge-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file EXE
        run: dotnet publish host/BazisWebViewerBridgeProbe/BazisWebViewerBridgeProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BAZIS-WebViewer-Bridge-Probe-Windows
          path: out/BAZIS-WebViewer-Bridge-Probe.exe

name: Build BAZIS DXGI probe

on:
  push:
    paths:
      - 'host/BazisDxgiProbe/**'
      - '.github/workflows/build-dxgi-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file EXE
        run: >-
          dotnet publish host/BazisDxgiProbe/BazisDxgiProbe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BAZIS-DXGI-Probe-Windows
          path: out/BAZIS-DXGI-Probe.exe
          if-no-files-found: error

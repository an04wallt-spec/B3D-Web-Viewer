name: Build B3D Hierarchy V5 Wire Test

on:
  workflow_dispatch:
  push:
    paths:
      - "test-b3d-hierarchy-v5/**"
      - ".github/workflows/build-b3d-hierarchy-v5-wire-test.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir build
          cat             test-generic-groups/source.b64.part-00             test-generic-groups/source.b64.part-01             test-generic-groups/source.b64.part-02a             test-generic-groups/source.b64.part-02b             test-generic-groups/source.b64.part-02c             test-generic-groups/source.b64.part-02d             test-generic-groups/source.b64.part-02e             test-generic-groups/source.b64.part-03             test-generic-groups/source.b64.part-04             | base64 -d > /tmp/generic-groups-source.zip
          unzip -q /tmp/generic-groups-source.zip -d build
          cat test-b3d-hierarchy/hierarchy.patch.b64.part-* | base64 -d > /tmp/hierarchy-v2.diff
          cp test-b3d-hierarchy/hierarchy-v3.diff /tmp/hierarchy-v3.diff
          cat test-b3d-hierarchy-v4/builder.exact.b64.part-* | base64 -d > /tmp/v4-builder.diff
          base64 -d test-b3d-hierarchy-v4/main_windows.exact.diff.b64 > /tmp/v4-windows.diff
          base64 -d test-b3d-hierarchy-v4/builder_test_main.exact.diff.b64 > /tmp/v4-testmain.diff
          cd build
          patch --batch -p5 < /tmp/hierarchy-v2.diff
          patch --batch -p5 < /tmp/hierarchy-v3.diff
          patch --batch -p4 < /tmp/v4-builder.diff
          patch --batch -p4 < /tmp/v4-windows.diff
          patch --batch -p4 < /tmp/v4-testmain.diff

      - name: Apply V5 wire-mode and stable UI
        shell: bash
        run: |
          set -euo pipefail
          base64 -d test-b3d-hierarchy-v5/builder.diff.b64 > /tmp/v5-builder.diff
          base64 -d test-b3d-hierarchy-v5/main_windows.diff.b64 > /tmp/v5-windows.diff
          cd build
          patch --batch -p4 < /tmp/v5-builder.diff || true
          python3 -c 'from pathlib import Path; p=Path("builder.go"); s=p.read_text(); a=s.find("\\n\\t\\tappendProxyBox := func("); b=s.find("\\n\\t\\ttris, triLogical, triLeafForSimplify = newTris, newLogical, newLeaf", a) if a!=-1 else -1; (_ for _ in ()).throw(SystemExit("cannot locate end of V4 proxy block")) if a!=-1 and b==-1 else None; p.write_text(s if a==-1 else s[:a]+s[b:])'
          patch --batch -p4 < /tmp/v5-windows.diff
          gofmt -w builder.go main_windows.go builder_test_main.go
          go test ./...

      - name: Build Windows GUI EXE
        shell: bash
        run: |
          set -euo pipefail
          cd build
          GOOS=windows GOARCH=amd64 go build -ldflags="-H=windowsgui" -o "Генератор_PRO_B3D_HIERARCHY_V5_TEST_2026-09-30.exe" .
          sha256sum "Генератор_PRO_B3D_HIERARCHY_V5_TEST_2026-09-30.exe" > SHA256.txt
          zip -9 "../B3D_HIERARCHY_V5_TEST_PACKAGE_2026-09-30.zip"             "Генератор_PRO_B3D_HIERARCHY_V5_TEST_2026-09-30.exe"             builder.go main_windows.go builder_test_main.go go.mod SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: B3D_HIERARCHY_V5_TEST_PACKAGE_2026-09-30
          path: B3D_HIERARCHY_V5_TEST_PACKAGE_2026-09-30.zip
          if-no-files-found: error
          retention-days: 30

name: Build autonomous HTML demo

on:
  push:
    branches: [main]
    paths:
      - 'parser/**'
      - 'geometry/**'
      - 'publisher/**'
      - 'samples/Стол_3100х750х1300.b3d'
      - '.github/workflows/build-demo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build one-file offline viewer
        run: |
          mkdir -p dist
          python publisher/publish.py 'samples/Стол_3100х750х1300.b3d' -o 'dist/Стол_3100х750х1300.html'
          ls -lh dist/Стол_3100х750х1300.html

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: B3D-offline-HTML-demo
          path: dist/Стол_3100х750х1300.html
          retention-days: 30

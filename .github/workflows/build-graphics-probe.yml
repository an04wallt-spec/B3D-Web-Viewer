name: Build BAZIS graphics probe

on:
  push:
    paths:
      - 'host/BazisGraphicsProbe/**'
      - '.github/workflows/build-graphics-probe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file EXE
        run: >-
          dotnet publish host/BazisGraphicsProbe/BazisGraphicsProbe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BAZIS-Graphics-Probe-Windows
          path: out/BAZIS-Graphics-Probe.exe
          if-no-files-found: error

name: Build analysis tooling

on:
  push:
    paths:
      - '.github/workflows/tooling.yml'
  workflow_dispatch:

jobs:
  upx:
    runs-on: ubuntu-latest
    steps:
      - name: Download official UPX
        run: |
          curl -L -o upx.tar.xz https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz
          tar -xf upx.tar.xz
          cp upx-5.2.0-amd64_linux/upx ./upx
          chmod +x ./upx
          ./upx --version
      - name: Upload UPX tool
        uses: actions/upload-artifact@v4
        with:
          name: upx-linux-amd64
          path: upx
          retention-days: 1
